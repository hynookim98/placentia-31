<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Time Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8"
  <style>
    body { background-color: #f8fafc; }
    .container { max-width: 600px; margin: auto; }
  </style>
</head>
<body class="p-4 text-gray-800">

  <div class="container bg-white rounded-2xl shadow-lg p-6 mt-4">
    <h1 class="text-2xl font-bold text-center mb-4 text-blue-700">Route 31 Time Scheduler</h1>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Start Time</label>
      <input id="startTime" type="time" value="08:00" class="w-full p-2 border rounded-lg" />
    </div>

    <button 
      onclick="generateSchedule()" 
      class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">
      Generate Schedule
    </button>

    <div id="scheduleOutput" class="mt-6"></div>
  </div>

  <script>
    const neighborhoods = [
      "Office",
      "Businesses",
      "Pecos",
      "Santee",
      "Big Horn",
      "Sesquehanna",
      "Salmon",
      "Rock",
      "Feather/Allegheny",
      "Santa Rosa/San Luis",
      "Driving",
      "Kingston",
      "Jamaca",
      "Larkspur",
      "Heritage",
      "Sierra Bonita",
      "Lunch",
      "Fisher",
      "La Selle",
      "Demmer",
      "Pickups/Unload",
      "End Time"
    ];

    function getDuration(name) {
      name = name.toLowerCase();
      if (name === "office") return 75;
      if (name === "businesses") return 60;
      if (name === "lunch") return 30;
      if (name === "sierra bonita") return 30;
      if (name === "driving") return 30;
      if (name === "pickups/unload") return 30;
      if (name.includes("/")) return 30;
      if (name === "end time") return 0;
      return 15;
    }

    function generateSchedule() {
      const startTimeInput = document.getElementById("startTime").value;
      if (!startTimeInput) {
        alert("Please enter a valid start time");
        return;
      }

      const [startHour, startMin] = startTimeInput.split(":").map(Number);
      let currentTime = new Date();
      currentTime.setHours(startHour, startMin, 0, 0);

      let scheduleHTML = `
        <h2 class="text-xl font-semibold mb-3 text-gray-700">Generated Schedule</h2>
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-100 text-left">
              <th class="p-2 border">Neighborhood</th>
              <th class="p-2 border">Start Time</th>
            </tr>
          </thead>
          <tbody>
      `;

      let totalMinutes = 0;

      neighborhoods.forEach((name, index) => {
        const duration = getDuration(name);
        totalMinutes += duration;

        const hours = currentTime.getHours();
        const minutes = currentTime.getMinutes().toString().padStart(2, "0");
        const formattedTime = formatTo12Hour(hours, minutes);

        scheduleHTML += `
          <tr class="border-b hover:bg-gray-50 ${name.toLowerCase() === "lunch" ? "bg-yellow-100" : ""}">
            <td class="p-2 border">${name}</td>
            <td class="p-2 border text-blue-600 font-medium">${formattedTime}</td>
          </tr>
        `;

        if (index < neighborhoods.length - 1) {
          currentTime.setMinutes(currentTime.getMinutes() + duration);
        }
      });

      scheduleHTML += "</tbody></table>";

      // Display end time
      const endTime = new Date();
      const [sh, sm] = startTimeInput.split(":").map(Number);
      endTime.setHours(sh, sm, 0, 0);
      endTime.setMinutes(endTime.getMinutes() + totalMinutes);
      const formattedEnd = formatTo12Hour(endTime.getHours(), endTime.getMinutes());

      scheduleHTML += `<p class="mt-3 font-semibold text-gray-700">Estimated End Time: <span class="text-blue-600">${formattedEnd}</span></p>`;

      document.getElementById("scheduleOutput").innerHTML = scheduleHTML;
    }

    function formatTo12Hour(hours, minutes) {
      const suffix = hours >= 12 ? "PM" : "AM";
      const adjustedHour = ((hours + 11) % 12 + 1);
      return `${adjustedHour}:${minutes.toString().padStart(2,"0")} ${suffix}`;
    }
  </script>

</body>
</html>
